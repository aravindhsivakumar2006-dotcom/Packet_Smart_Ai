{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3>Register</h3>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="/register">
            <div class="mb-3"><label>Username</label><input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3"><label>Email</label><input type="email" name="email" class="form-control" required></div>
            <div class="mb-3"><label>Password</label><input type="password" name="password" class="form-control"
                    required></div>
            <button class="btn btn-success w-100">Register</button>
        </form>
        <p class="mt-3">Already have account? <a href="/login">Login</a></p>
    </div>
</div>
{% endblock %}
