{% extends "base.html" %}
{% block content %}
<h3>💍 Jewelry Budget Planner</h3>
<form method="post" action="/generate-jewelry" enctype="multipart/form-data">
    <div class="mb-3"><label>Total Budget</label><input type="number" name="total_budget" class="form-control" required
            value="10000"></div>
    <div class="mb-3"><label>Occasion</label><select name="occasion" class="form-select">
            <option>Wedding</option>
            <option>Festival</option>
            <option>Party</option>
            <option>Daily</option>
            <option>Engagement</option>
        </select></div>
    <div class="mb-3"><label>Style</label><input type="text" name="style" class="form-control"
            value="Traditional gold, matching red saree" required></div>
    <div class="mb-3"><label>Outfit Image (Optional)</label><input type="file" name="outfit_image" class="form-control"
            accept="image/*"></div>
    <button class="btn btn-warning">Generate Jewelry Suggestions ✨</button>
</form>
{% endblock %}
